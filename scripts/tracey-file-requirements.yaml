      - actor.lock-first.channels
      - actor.is-running-loop
    test_default_verify: actor.run-dispatcher
    impl_patterns:
      - {substr: internal_behavior, id: actor.internal-behavior-logic, verb: impl}
      - {substr: run, id: actor.run-dispatcher, verb: impl}
      - {substr: lock, id: actor.lock-first.channels, verb: impl}

  steady_actor.rs:
    primary: actor.run-dispatcher
    requirements:
