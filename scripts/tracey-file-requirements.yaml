# File → Tracey requirement mapping for steady-state/rust-core.
# Used by tracey_map_unmapped.py and annotate_tracey_tests.py.
#
# Fields per file:
#   primary: default requirement id
#   verb: impl | related (default related)
#   requirements: extra ids (file-level related on unmapped units)
#   test_default_verify: apply to all tests in file when set
#   test_rules: [{substr, id}] for annotate_tracey_tests.py
#   impl_patterns: [{substr, id, verb?}] prefer impl on name match

defaults:
  verb: related

files:
  monitor.rs:
    primary: philosophy.single-wake-up
    verb: related
    requirements:
      - actor.wait-avail-vacant
      - actor.index-wait-round-robin
      - actor.index-wait-truthful
      - bundle.index-wait-readiness
      - bundle.deprecated-bundle-waits
    test_default_verify: philosophy.single-wake-up
    test_rules:
      - {substr: wait_avail_bundle, id: bundle.deprecated-bundle-waits}
      - {substr: wait_avail_index, id: actor.index-wait-round-robin}
      - {substr: wait_vacant, id: actor.wait-avail-vacant}
      - {substr: wait_for_index, id: bundle.wait-for-index-macro}
      - {substr: index_wait, id: bundle.index-wait-readiness}
    impl_patterns:
      - {substr: wait_avail_index, id: actor.index-wait-round-robin, verb: impl}
      - {substr: wait_avail_bundle, id: bundle.deprecated-bundle-waits, verb: impl}
      - {substr: wait_vacant_index, id: actor.index-wait-truthful, verb: impl}

  dot.rs:
    primary: telemetry.dot-export
    test_default_verify: telemetry.dot-export

  dot_edge.rs:
    primary: telemetry.dot-export

  dot_node.rs:
