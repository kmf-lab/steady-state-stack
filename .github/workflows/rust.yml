name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always


jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Clean
      run: cargo clean
    - name: Build
      run: RUST_BACKTRACE=1 cargo build --verbose
    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest
    - name: Run tests (Gate A — excludes live aeron_integration_suite)
      run: RUST_LOG=debug RUST_BACKTRACE=full cargo nextest run --verbose --workspace --profile ci-unit --examples --tests --success-output immediate
    - name: Run tests with Tokio current-thread reactor
      run: RUST_LOG=debug RUST_BACKTRACE=full cargo nextest run --verbose --workspace --profile ci-unit --examples --tests --features tokio --success-output immediate
    - name: Tracey validate (spec traceability)
      run: bash scripts/tracey-ci-validate.sh
    - name: Tracey unmapped gate (80% mapped code units)
      run: bash scripts/tracey-unmapped-gate.sh
    - name: Tracey untested gate (distributed + stream.control-payload)
      run: bash scripts/tracey-untested-gate.sh
    - name: File size gate (core/src line caps)
      run: bash scripts/check-file-size.sh
