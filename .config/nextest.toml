# Gate A (unit): excludes live Aeron driver suites — they require Gate C env (SS_AERON_GATE_C=1).
# Gate C: `./scripts/run-aeron-integration.sh` or `cargo nextest run --profile aeron-live`.
# Profile filters use `default-filter` (nextest 0.9.75+); `filter` is only valid on overrides.

[store]
dir = "target/nextest"

[profile.default]
default-filter = 'not (test(aeron_integration_serial_suite) | test(aeron_preflight_wire_settle))'

[profile.ci-unit]
default-filter = 'not (test(aeron_integration_serial_suite) | test(aeron_preflight_wire_settle))'
slow-timeout = { period = "300s", terminate-after = 2 }
success-output = "never"
failure-output = "immediate"
status-level = "fail"

[profile.aeron-live]
default-filter = 'test(aeron_integration_serial_suite) | test(aeron_preflight_wire_settle)'
test-threads = 1
slow-timeout = { period = "120s", terminate-after = 2 }

[profile.mutants]
default-filter = 'not (test(aeron_integration_serial_suite) | test(aeron_preflight_wire_settle))'
test-threads = 1
slow-timeout = { period = "300s", terminate-after = 2 }
