# cargo-mutants configuration for the `steady_state` crate.
# Docs: https://mutants.rs/
#
# Stage-1 critical modules for the V2V Mutants B campaign.
# Iterate file-by-file with scripts/run-mutants-iterate.sh (fail-fast on miss).
# Widen examine_globs (Stage-2: pack.rs, slot_budget.rs, shutdown.rs, core_rx.rs, core_tx.rs)
# when Stage-1 kill-rate is green.

examine_globs = [
    "**/graph/liveliness.rs",
    "**/core_rx_stream.rs",
    "**/core_tx_stream.rs",
    "**/dot_unify.rs",
]

# Dot telemetry edge merge: bash scripts/run-mutants-iterate.sh -f dot_unify.rs
# Full list above increases wall time. Use `--shard i/n` for CI splits.

# Match pre-publish: run unit/integration tests via nextest, scoped to this package.
test_tool = "nextest"
test_workspace = false

# TIMEOUT counts as killed. Keep this low so hang-mutants do not cost minutes.
minimum_test_timeout = 30.0
